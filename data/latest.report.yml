s recover their sharpness after a display change.** A wake or monitor move no longer has to leave the app stretched at the wrong scale; refocusing gives the renderer another chance to match the display it is on. (#9409)\n- **Installed macOS updates have a steadier handoff.** Payload updates now run through the installed app’s lifecycle, so a failed generation can recover without trapping the next launch on a broken handoff. (#8936) Thanks @PerishCode.\n\n### 💳 Workspace and billing\n\n- **Quota reset times keep the minutes that matter.** When a reset is days away, the quota panel now still tells you the remaining minutes instead of making the deadline feel less precise than it is. (#9328)\n- **A failed move to team space now looks like a failure.** Project-card menu errors use the same clear error treatment as the rest of the workspace, so the next action is easier to judge. (#9409)\n\n> 📥 **Download:** Tag `open-design-v0.27.2`.\n>\n> | Platform | Architecture | Assets |\n> |---|---|---|\n> | macOS | Apple silicon | [DMG](https://github.com/nexu-io/open-design/releases/download/open-design-v0.27.2/open-design-0.27.2-mac-arm64.dmg) · [SHA-256](https://github.com/nexu-io/open-design/releases/download/open-design-v0.27.2/open-design-0.27.2-mac-arm64.dmg.sha256) |\n> | macOS | Intel | [DMG](https://github.com/nexu-io/open-design/releases/download/open-design-v0.27.2/open-design-0.27.2-mac-x64.dmg) · [SHA-256](https://github.com/nexu-io/open-design/releases/download/open-design-v0.27.2/open-design-0.27.2-mac-x64.dmg.sha256) |\n> | Windows | x64 | [Installer](https://github.com/nexu-io/open-design/releases/download/open-design-v0.27.2/open-design-0.27.2-win-x64-setup.exe) · [SHA-256](https://github.com/nexu-io/open-design/releases/download/open-design-v0.27.2/open-design-0.27.2-win-x64-setup.exe.sha256) |\n\n## 🙏 Thanks to everyone who shipped 0.27.2\n\n@PerishCode · @lefarcen · @alchemistklk\n","reactions":{"total_count":4,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0