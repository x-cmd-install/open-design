](https://github.com/nexu-io/open-design/releases).\n\n## 🔥 Highlights\n\n- **🎉 Invite friends, earn together.** Invite a friend to subscribe and both of you receive a Reset Card. A simple invitation turns into a shared boost for the next thing you make.\n- **💡 Start creating from \\$8.** Your first month starts at \\$8, with up to \\$220 in DeepSeek usage to help you keep experimenting.\n- **🎬 Make more in one place.** Turn ideas into motion videos, design work, and slides without leaving OpenDesign.\n","reactions":{"total_count":3,"+1":3,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0}}
